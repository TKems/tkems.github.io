name: Validate Jekyll site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.4'
          bundler-cache: true
      - name: Build with GitHub Pages dependencies
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - name: Verify URLs, metadata, and internal links
        run: python3 scripts/verify_site.py
