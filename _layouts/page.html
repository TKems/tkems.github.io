---
layout: default
---
<article class="page{% unless page.wide %} prose{% endunless %}">
  <header class="page-header">
    <p class="eyebrow">{{ page.eyebrow | default: 'Trevor Kems' }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.intro %}<p class="lead">{{ page.intro }}</p>{% endif %}
  </header>
  <div class="entry">{{ content }}</div>
</article>
